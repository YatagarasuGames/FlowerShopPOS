services:
  db:
    image: postgres:18-alpine
    container_name: flowershop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: ./FlowerShopBackend
      dockerfile: Dockerfile
    container_name: flowershop_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__DbConnection=Host=db;Port=5432;Database=flowers_db;Username=flower_user;Password=FLow3rDATaBase1337#;
      - JwtSettings__Secret=aB6]X/|/0Kyo=X@;MI5Y)]VHImY1K_r,s^2h(tU.N,ptUGQE_**r?uZ7Q@y_DS!n{ihT5o^s=@6D_ev^6x67CS
      - JwtSettings__Issuer=FlowerShopAPI
      - JwtSettings__Audience=FlowerShopClient
      - JwtSettings__ExpiryHours=12
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
  
  frontend:
    build:
      context: ./FlowerShopFrontend
      dockerfile: Dockerfile
    container_name: flowershop_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  internal_net:
    driver: bridge
